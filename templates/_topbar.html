<header class="topbar">
	<a class="mark" href="{{ url_for('index') }}">
		<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
			<path d="M4 18.5 L15 7.5 L17 9.5 L6 20.5 L3.2 21 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
			<path d="M14 8.5 L16 6.5 a1.6 1.6 0 0 1 2.3 0 l0.2 0.2 a1.6 1.6 0 0 1 0 2.3 L16.5 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
		</svg>
		<span>Assinatura Digital</span>
	</a>
	<nav class="doc-status">
		{% if doc_hash_short %}
		<span class="dot" aria-hidden="true"></span>
		<span class="mono" title="SHA-256 do documento">sha256:{{ doc_hash_short }}…</span>
		<span class="sep">·</span>
		{% endif %}
		<a href="{{ url_for('verify_page') }}">Verificar recibo</a>
	</nav>
</header>
